<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12355B">
<meta name="description" content="Household QR ID for evacuation centers. Web dashboard and offline scanner.">
<title>Kaligtasan ID</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>
  // Apply the saved theme before first paint to avoid a flash.
  try { var th = localStorage.getItem('kid-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
  try { var z = { s: .9, l: 1.1, xl: 1.2 }[localStorage.getItem('kid-size')]; if (z) document.documentElement.style.setProperty('--ui-zoom', z); } catch (e) {}
</script>
</head>
<body>
<div id="app"><div class="boot" role="status" aria-live="polite"><span class="boot-dot"></span>Loading Kaligtasan ID…</div></div>
<div id="print-sheet" aria-hidden="true"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
